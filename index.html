<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffb6c1, #ff8fab, #ff4d88);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.card {
    background: #fff0f6;
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    width: 380px;
    box-shadow: 0 15px 40px rgba(255, 77, 136, 0.35);
    position: relative;
    transition: 0.6s ease;
}

.hidden {
    display: none;
}

h1 {
    font-family: 'Playfair Display', serif;
    color: #d63384;
}

p {
    color: #ad1457;
    font-size: 15px;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 8px;
    font-weight: 500;
    transition: 0.3s ease;
}

.yes {
    background: linear-gradient(45deg, #ff4d88, #ff80ab);
    color: white;
    box-shadow: 0 5px 15px rgba(255, 77, 136, 0.4);
}

.yes:hover {
    transform: scale(1.1);
}

.no {
    background: #ffd1e8;
    color: #ad1457;
    position: relative;
}

#response {
    margin-top: 15px;
    font-weight: bold;
    color: #d63384;
}

@keyframes fall {
    to {
        transform: translateY(110vh);
        opacity: 0;
    }
}

.info-box {
    margin-top: 20px;
    background: #ffe3ec;
    padding: 15px;
    border-radius: 15px;
}
</style>
</head>
<body>

<!-- FIRST PAGE -->
<div class="card" id="firstPage">
    <h1>Will You Be My Valentine? 💖</h1>
    

    <button class="yes" onclick="sayYes()">YES 💕</button>
    <button class="no" id="noBtn">No 😢</button>

    <div id="response"></div>
</div>

<!-- SECOND PAGE -->
<div class="card hidden" id="secondPage">
    <h1>It's a Date 💗</h1>
    <p>I can't wait to spend this day with you bubba.</p>

    <div class="info-box">
        <p><strong>📅 When:</strong> February 14, 7:00 PM</p>
        <p><strong>📍 Where:</strong> Sumo Niku Abreeza</p>
        <p><strong>💌 What:</strong> Dinner, surprises, and lots of love</p>
    </div>
</div>

<script>
// Make NO button run away
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * 300 - 150;
    const y = Math.random() * 200 - 100;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

// YES button action
function sayYes() {
    document.getElementById("response").innerHTML =
        "Thank you, see you there bubba";

    // Confetti hearts
    for (let i = 0; i < 40; i++) {
        let heart = document.createElement("div");
        heart.innerHTML = "💖";
        heart.style.position = "absolute";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "-10px";
        heart.style.fontSize = "20px";
        heart.style.animation = "fall 3s linear forwards";
        document.body.appendChild(heart);
    }

    // Switch page after short delay
    setTimeout(() => {
        document.getElementById("firstPage").classList.add("hidden");
        document.getElementById("secondPage").classList.remove("hidden");
    }, 1500);
}
</script>

</body>
</html>
