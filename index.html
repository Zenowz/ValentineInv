<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffb6c1, #ff8fab, #ff4d88);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow-x: hidden;
}

.card {
    background: #fff0f6;
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    width: 400px;
    max-width: 95%;
    box-shadow: 0 15px 40px rgba(255, 77, 136, 0.35);
    position: relative;
}

.hidden {
    display: none;
}

h1 {
    font-family: 'Playfair Display', serif;
    color: #d63384;
}

p {
    color: #ad1457;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 8px;
    font-weight: 500;
    transition: 0.3s ease;
}

.yes {
    background: linear-gradient(45deg, #ff4d88, #ff80ab);
    color: white;
}

.yes:hover {
    transform: scale(1.1);
}

.no {
    background: #ffd1e8;
    color: #ad1457;
    position: absolute;
}

/* Invitation info box */
.info-box {
    margin-top: 20px;
    background: #ffe3ec;
    padding: 15px;
    border-radius: 15px;
}

/* Photo Gallery */
.photo-gallery {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.polaroid {
    background: white;
    padding: 10px 10px 25px 10px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4);
    text-align: center;
    width: 130px;
    animation: glow 3s ease-in-out infinite alternate;
    transition: transform 0.3s ease;
}

.polaroid:nth-child(1) { transform: rotate(-4deg); }
.polaroid:nth-child(2) { transform: rotate(3deg); }
.polaroid:nth-child(3) { transform: rotate(-2deg); }
.polaroid:nth-child(4) { transform: rotate(4deg); }
.polaroid:nth-child(5) { transform: rotate(-3deg); }

.polaroid:hover {
    transform: scale(1.08) rotate(0deg);
}

.polaroid img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
}

.polaroid p {
    font-size: 12px;
    margin-top: 8px;
    color: #d63384;
}

@keyframes glow {
    from { box-shadow: 0 10px 20px rgba(255, 105, 180, 0.3); }
    to { box-shadow: 0 15px 35px rgba(255, 20, 147, 0.6); }
}

@keyframes fall {
    to { transform: translateY(110vh); opacity: 0; }
}
</style>
</head>
<body>

<!-- FIRST PAGE -->
<div class="card" id="firstPage">
    <h1>Will You Be My Valentine? 💖</h1>
    <p>I want this one to be special.</p>

    <button class="yes" onclick="sayYes()">YES 💕</button>
    <button class="no" id="noBtn">No 😢</button>
</div>

<!-- SECOND PAGE -->
<div class="card hidden" id="secondPage">
    <h1>It's a Date 💗</h1>

    <div class="info-box">
        <p><strong>📅 When:</strong> February 14, 7:00 PM</p>
        <p><strong>📍 Where:</strong> Sumo Niku Abreeza</p>
        <p><strong>💌 What:</strong> Dinner, surprises, and lots of love</p>
    </div>

    <div class="photo-gallery">
        <div class="polaroid">
            <img src="images/photo1.jpg" alt="">
            <p>Our First Adventure 💕</p>
        </div>
        <div class="polaroid">
            <img src="images/photo2.jpg" alt="">
            <p>That Perfect Day ✨</p>
        </div>
        <div class="polaroid">
            <img src="images/photo3.jpeg" alt="">
            <p>Laughing With You 😄</p>
        </div>
        <div class="polaroid">
            <img src="images/photo4.jpeg" alt="">
            <p>Unforgettable Moment 💖</p>
        </div>
        <div class="polaroid">
            <img src="images/photo5.jpeg" alt="">
            <p>My Favorite Person 💘</p>
        </div>
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const card = document.getElementById("firstPage");

function moveNoButton() {
    const cardRect = card.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    const maxX = cardRect.width - btnRect.width - 20;
    const maxY = cardRect.height - btnRect.height - 20;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

noBtn.addEventListener("mouseover", moveNoButton);
noBtn.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveNoButton();
});

function sayYes() {
    for (let i = 0; i < 40; i++) {
        let heart = document.createElement("div");
        heart.innerHTML = "💖";
        heart.style.position = "absolute";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "-10px";
        heart.style.fontSize = "20px";
        heart.style.animation = "fall 3s linear forwards";
        document.body.appendChild(heart);
    }

    setTimeout(() => {
        document.getElementById("firstPage").classList.add("hidden");
        document.getElementById("secondPage").classList.remove("hidden");
        window.scrollTo(0,0);
    }, 1200);
}
</script>

</body>
</html>
